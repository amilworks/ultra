name: ✨ Feature request
description: Propose a new capability or improvement
title: "[feature]: "
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! Describe the problem first, then the solution you have in mind.
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do, and why is it hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What should happen? Sketch the UX, API, or behavior if you can.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the system would this touch? (A maintainer will apply the matching `area:` label.)
      options:
        - frontend (web app)
        - control-plane (Go backend)
        - worker (deepagents runtime)
        - viewer (Lens / imaging)
        - data services (image / ngff / storage)
        - infra (docker / CI / deploy)
        - agents (skills / prompts)
        - not sure
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you thought about, and why this one is better.
