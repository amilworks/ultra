name: Materials Domain Gate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/materials-domain-gate.yml"
      - ".github/workflows/materials-production-qualification.yml"
      - ".github/workflows/release-artifacts.yml"
      - "Makefile"
      - "deploy/docker/materials-*"
      - "deploy/docker/mattools-*"
      - "deploy/docker/deepagents-sandbox.Dockerfile"
      - "scripts/materials_domain_gate.py"
      - "scripts/materials_readiness_gate.py"
      - "scripts/materials_promotion_envelope.py"
      - "scripts/mattools*"
      - "scripts/run_materials_domain_gate.sh"
      - "scripts/deploy_ultra_control_stack.sh"
      - "scripts/build_ultra_release_artifact.sh"
      - "scripts/calphad_ledger_gate.py"
      - "scripts/calphad_cross_language_gate.py"
      - "scripts/verify_production_materials_sandbox.py"
      - "tests/test_calphad_ledger_gate.py"
      - "tests/test_calphad_cross_language_gate.py"
      - "tests/test_materials_domain_gate_runner.py"
      - "tests/test_materials_readiness_gate.py"
      - "tests/test_materials_promotion_envelope.py"
      - "tests/test_materials_production_workflow.py"
      - "tests/test_mattools_*"
      - "tests/test_production_materials_sandbox.py"
      - "backend/deepagents_runtime/src/ultra_deepagents/materials/**"
      - "backend/deepagents_runtime/src/ultra_deepagents/kinetics_runtime/**"
      - "backend/deepagents_runtime/src/ultra_deepagents/kinetics_tools.py"
      - "backend/deepagents_runtime/src/ultra_deepagents/crystal_plasticity_tools.py"
      - "backend/deepagents_runtime/src/ultra_deepagents/degradation_characterization_tools.py"
      - "backend/deepagents_runtime/src/ultra_deepagents/ngff/**"
      - "backend/deepagents_runtime/src/ultra_deepagents/papers/**"
      - "backend/deepagents_runtime/src/ultra_deepagents/sensors/**"
      - "backend/deepagents_runtime/src/ultra_deepagents/vision/**"
      - "backend/deepagents_runtime/pyproject.toml"
      - "backend/deepagents_runtime/uv.lock"
      - "backend/deepagents_runtime/.dockerignore"
      - "backend/deepagents_runtime/Dockerfile.worker"
      - "backend/deepagents_runtime/MATERIALS_PRODUCTION_READINESS.md"
      - "backend/deepagents_runtime/MATTOOLS_PROMOTION_GATE.md"
      - "backend/deepagents_runtime/src/ultra_deepagents/agent.py"
      - "backend/deepagents_runtime/src/ultra_deepagents/bisque/**"
      - "backend/deepagents_runtime/src/ultra_deepagents/code_execution/**"
      - "backend/deepagents_runtime/src/ultra_deepagents/config.py"
      - "backend/deepagents_runtime/src/ultra_deepagents/context.py"
      - "backend/deepagents_runtime/src/ultra_deepagents/context_tools.py"
      - "backend/deepagents_runtime/src/ultra_deepagents/async_delegation.py"
      - "backend/deepagents_runtime/src/ultra_deepagents/evaluation_profiles.py"
      - "backend/deepagents_runtime/src/ultra_deepagents/live_trace.py"
      - "backend/deepagents_runtime/src/ultra_deepagents/nats_worker.py"
      - "backend/deepagents_runtime/src/ultra_deepagents/schemas.py"
      - "backend/deepagents_runtime/materials_data/**"
      - "backend/deepagents_runtime/skills/computational-materials/**"
      - "backend/deepagents_runtime/skills/materials-*/**"
      - "backend/deepagents_runtime/tests/domain_correctness/conftest.py"
      - "backend/deepagents_runtime/tests/domain_correctness/test_materials_invariants.py"
      - "backend/deepagents_runtime/tests/domain_correctness/test_advanced_characterization.py"
      - "backend/deepagents_runtime/tests/domain_correctness/test_crystal_plasticity_invariants.py"
      - "backend/deepagents_runtime/tests/domain_correctness/test_degradation_primitives.py"
      - "backend/deepagents_runtime/tests/domain_correctness/test_processing_kinetics.py"
      - "backend/deepagents_runtime/tests/test_calphad_runtime.py"
      - "backend/deepagents_runtime/tests/test_calphad_cli.py"
      - "backend/deepagents_runtime/tests/test_calphad_tools.py"
      - "backend/deepagents_runtime/tests/test_crystal_plasticity_agent_registration.py"
      - "backend/deepagents_runtime/tests/test_crystal_plasticity_tools.py"
      - "backend/deepagents_runtime/tests/test_degradation_characterization_agent_registration.py"
      - "backend/deepagents_runtime/tests/test_degradation_characterization_tools.py"
      - "backend/deepagents_runtime/tests/kinetics_runtime/**"
      - "backend/deepagents_runtime/tests/fixtures/materials_natural_prompts/**"
      - "backend/deepagents_runtime/tests/test_agent_factory.py"
      - "backend/deepagents_runtime/tests/test_async_delegation.py"
      - "backend/deepagents_runtime/tests/test_bisque_tools.py"
      - "backend/deepagents_runtime/tests/test_degradation_prompt_routing.py"
      - "backend/deepagents_runtime/tests/test_kinetics_agent_registration.py"
      - "backend/deepagents_runtime/tests/test_kinetics_tools.py"
      - "backend/deepagents_runtime/tests/test_materials_live_trace.py"
      - "backend/deepagents_runtime/tests/test_materials_natural_prompt_fixtures.py"
      - "backend/deepagents_runtime/tests/test_materials_skill_routing.py"
      - "backend/deepagents_runtime/tests/test_ngff.py"
      - "backend/deepagents_runtime/tests/test_paper_table_evidence.py"
      - "backend/deepagents_runtime/tests/test_paper_tools.py"
      - "backend/deepagents_runtime/tests/test_sensor_agent_integration.py"
      - "backend/deepagents_runtime/tests/test_sensor_series.py"
      - "backend/deepagents_runtime/tests/test_sensor_tools.py"
      - "backend/deepagents_runtime/tests/test_sensor_worker_core_smoke.py"
      - "backend/deepagents_runtime/tests/test_vision_subagent.py"
      - "backend/deepagents_runtime/tests/test_worker_transport.py"
      - "backend/deepagents_runtime/tests/test_zarr_tree_identity_contract.py"
      - "frontend/src/App.tsx"
      - "frontend/src/lib/api.ts"
      - "frontend/src/lib/bisqueMutationIntent.ts"
      - "frontend/src/lib/bisqueMutationIntent.test.ts"
      - "frontend/src/types.ts"
      - "backend/controlplane/internal/eventbus/**"
      - "backend/controlplane/internal/httpapi/**"
      - "backend/controlplane/integration/**"
      - "backend/controlplane/api/openapi.yaml"
      - "backend/controlplane/internal/domain/calphad.go"
      - "backend/controlplane/internal/openapi/**"
      - "backend/controlplane/internal/store/**"
      - "backend/controlplane/internal/runcontrol/**"
      - "backend/controlplane/migrations/**"
  schedule:
    - cron: "17 9 * * *"

concurrency:
  group: materials-domain-gate-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deterministic-materials:
    name: Deterministic Materials Invariants
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MATERIALS_DOMAIN_GATE_IMAGE: bisque-ultra-materials-domain-gate:${{ github.sha }}
      MATERIALS_KINETICS_IMAGE: bisque-ultra-materials-kinetics:${{ github.sha }}
      MATERIALS_DOMAIN_GATE_REPORT_DIR: ${{ github.workspace }}/.tmp/materials-domain-gate
      MATERIALS_DOMAIN_GATE_REQUIRE_CLEAN_PROVENANCE: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/controlplane/go.mod
          cache-dependency-path: backend/controlplane/go.sum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build pinned materials gate image
        id: materials-image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/materials-domain-gate.Dockerfile
          load: true
          tags: ${{ env.MATERIALS_DOMAIN_GATE_IMAGE }}
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=materials-domain-gate
          cache-to: type=gha,mode=max,scope=materials-domain-gate

      # Kawin 0.5 requires NumPy 2; the deterministic materials image is a
      # separately qualified NumPy-1.26 environment. Keep the runtimes isolated.
      - name: Build isolated Kawin kinetics image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/materials-kinetics.Dockerfile
          load: true
          tags: ${{ env.MATERIALS_KINETICS_IMAGE }}
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha,scope=materials-kinetics
          cache-to: type=gha,mode=max,scope=materials-kinetics

      - name: Resolve and verify immutable Kawin image identity
        id: kinetics_identity
        run: |
          image_id="$(docker image inspect --format '{{.Id}}' "${MATERIALS_KINETICS_IMAGE}")"
          title="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.title" }}' "${MATERIALS_KINETICS_IMAGE}")"
          revision="$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "${MATERIALS_KINETICS_IMAGE}")"
          if [[ ! "${image_id}" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Kawin image did not resolve to an immutable local image ID" >&2
            exit 1
          fi
          if [[ "${title}" != "Ultra isolated materials kinetics runtime" ]]; then
            echo "Kawin image title does not match the qualified runtime contract" >&2
            exit 1
          fi
          if [[ "${revision}" != "${GITHUB_SHA}" ]]; then
            echo "Kawin image revision does not match the checked-out source" >&2
            exit 1
          fi
          echo "image_id=${image_id}" >> "${GITHUB_OUTPUT}"

      - name: Test gate report and parser machinery
        run: |
          docker run --rm --network none \
            --entrypoint python \
            --mount "type=bind,src=${GITHUB_WORKSPACE},dst=/workspace,readonly" \
            "${MATERIALS_DOMAIN_GATE_IMAGE}" \
            -m pytest -q /workspace/tests/test_materials_domain_gate_runner.py

      - name: Test production-parity runner contracts
        run: make materials-production-parity-test

      - name: Test fail-closed production-readiness aggregation
        run: make materials-production-readiness-test

      - name: Test materials closure and attestation boundary
        run: make materials-promotion-envelope-test

      - name: Test MatTools evaluator and promotion harness contracts
        run: make mattools-promotion-test

      - name: Test typed CALPHAD worker tools and agent registration
        working-directory: backend/deepagents_runtime
        run: uv run --extra dev pytest -q tests/test_calphad_tools.py

      - name: Test run-bound remote mutation authority and trace scoring
        working-directory: backend/deepagents_runtime
        run: >-
          uv run --extra dev pytest -q
          tests/test_bisque_tools.py
          tests/test_worker_transport.py
          tests/test_materials_live_trace.py

      - name: Test tenant-safe CALPHAD resource binding
        working-directory: backend/controlplane
        run: go test ./internal/httpapi ./internal/store ./internal/runcontrol -count=1

      - name: Run non-skipping materials domain gate
        env:
          MATERIALS_DOMAIN_GATE_IMAGE_DIGEST: ${{ steps.materials-image.outputs.digest }}
          MATERIALS_DOMAIN_GATE_SKIP_BUILD: "1"
        run: make materials-domain-gate

      - name: Qualify isolated Kawin runtime by exact image ID
        env:
          KINETICS_IMAGE_ID: ${{ steps.kinetics_identity.outputs.image_id }}
        run: |
          printf '%s\n' "${KINETICS_IMAGE_ID}" > "${MATERIALS_DOMAIN_GATE_REPORT_DIR}/materials-kinetics-image-id.txt"
          docker run --rm \
            --network none \
            --read-only \
            --tmpfs /tmp:rw,nosuid,nodev,size=1g \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --pids-limit 512 \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=${MATERIALS_DOMAIN_GATE_REPORT_DIR},dst=/reports" \
            --entrypoint python \
            "${KINETICS_IMAGE_ID}" \
            -I -m pytest -q -p no:cacheprovider /opt/ultra/tests/test_kawin_runtime.py \
            --junitxml=/reports/materials-kinetics-runtime-junit.xml

      - name: Test exact-ID product kinetics tools and registration
        working-directory: backend/deepagents_runtime
        env:
          ULTRA_MATERIALS_KINETICS_ACCEPTANCE_IMAGE_ID: ${{ steps.kinetics_identity.outputs.image_id }}
        run: >-
          uv run --extra dev pytest -q
          tests/test_kinetics_tools.py
          tests/test_kinetics_agent_registration.py
          --junitxml=${{ env.MATERIALS_DOMAIN_GATE_REPORT_DIR }}/materials-kinetics-tools-junit.xml

      - name: Test first-class crystal-plasticity tools and registration
        working-directory: backend/deepagents_runtime
        run: >-
          uv run --extra dev pytest -q
          tests/test_crystal_plasticity_tools.py
          tests/test_crystal_plasticity_agent_registration.py
          --junitxml=${{ env.MATERIALS_DOMAIN_GATE_REPORT_DIR }}/materials-crystal-plasticity-tools-junit.xml

      - name: Test bounded degradation and characterization tools and registration
        working-directory: backend/deepagents_runtime
        run: >-
          uv run --extra dev pytest -q
          tests/domain_correctness/test_degradation_primitives.py
          tests/domain_correctness/test_advanced_characterization.py
          tests/test_degradation_characterization_tools.py
          tests/test_degradation_characterization_agent_registration.py
          --junitxml=${{ env.MATERIALS_DOMAIN_GATE_REPORT_DIR }}/materials-degradation-characterization-tools-junit.xml

      - name: Test NGFF, sensor semantics, and exact Zarr tree identity
        working-directory: backend/deepagents_runtime
        run: >-
          uv run --extra dev pytest -q
          tests/test_ngff.py
          tests/test_sensor_series.py
          tests/test_sensor_tools.py
          tests/test_sensor_agent_integration.py
          tests/test_sensor_worker_core_smoke.py
          tests/test_zarr_tree_identity_contract.py
          --junitxml=${{ env.MATERIALS_DOMAIN_GATE_REPORT_DIR }}/materials-sensor-ngff-junit.xml

      - name: Test sealed paper and VLM provenance contracts
        working-directory: backend/deepagents_runtime
        run: >-
          uv run --extra dev pytest -q
          tests/test_paper_table_evidence.py
          tests/test_paper_tools.py
          tests/test_vision_subagent.py
          --junitxml=${{ env.MATERIALS_DOMAIN_GATE_REPORT_DIR }}/materials-paper-vlm-junit.xml

      - name: Test deterministic natural materials prompt fixtures
        working-directory: backend/deepagents_runtime
        run: >-
          uv run --extra dev pytest -q
          tests/test_materials_natural_prompt_fixtures.py
          tests/test_degradation_prompt_routing.py
          tests/test_materials_skill_routing.py
          --junitxml=${{ env.MATERIALS_DOMAIN_GATE_REPORT_DIR }}/materials-natural-prompts-junit.xml

      - name: Refuse hidden skips in annotated materials lanes
        run: |
          python3 - "${MATERIALS_DOMAIN_GATE_REPORT_DIR}" <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          from pathlib import Path

          report_dir = Path(sys.argv[1])
          reports = (
              "materials-kinetics-runtime-junit.xml",
              "materials-kinetics-tools-junit.xml",
              "materials-crystal-plasticity-tools-junit.xml",
              "materials-degradation-characterization-tools-junit.xml",
              "materials-sensor-ngff-junit.xml",
              "materials-paper-vlm-junit.xml",
              "materials-natural-prompts-junit.xml",
          )
          skipped_by_report: dict[str, int] = {}
          tests_by_report: dict[str, int] = {}
          for name in reports:
              root = ET.parse(report_dir / name).getroot()
              testcases = list(root.iter("testcase"))
              if not testcases:
                  raise SystemExit(f"annotated materials CI report contains no tests: {name}")
              tests_by_report[name] = len(testcases)
              skipped_by_report[name] = sum(
                  testcase.find("skipped") is not None for testcase in testcases
              )
          skipped = {name: count for name, count in skipped_by_report.items() if count}
          if skipped:
              raise SystemExit(f"annotated materials CI lanes contain skipped tests: {skipped}")
          print(
              f"zero skipped tests across {sum(tests_by_report.values())} tests "
              f"in {len(reports)} annotated materials CI reports"
          )
          PY

      - name: Run pinned-image DockerSandboxBackend source contract
        env:
          MATERIALS_EXPECTED_GIT_SHA: ${{ github.sha }}
          MATERIALS_PRODUCTION_PARITY_REPORT_DIR: ${{ github.workspace }}/.tmp/materials-production-source-contract
        run: make materials-production-source-contract

      - name: Publish gate summary
        if: always()
        run: |
          if [[ -f "${MATERIALS_DOMAIN_GATE_REPORT_DIR}/materials-domain-gate.md" ]]; then
            cat "${MATERIALS_DOMAIN_GATE_REPORT_DIR}/materials-domain-gate.md" >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Upload materials gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materials-domain-gate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MATERIALS_DOMAIN_GATE_REPORT_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload DockerSandboxBackend source-contract evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: materials-production-source-contract-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/.tmp/materials-production-source-contract
          if-no-files-found: error
          retention-days: 30

  calphad-ledger-postgres:
    name: CALPHAD PostgreSQL Ledger Qualification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: ultra_calphad_qualification
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ultra_calphad_qualification"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ULTRA_CONTROL_TEST_DATABASE_URL: postgresql://ultra_calphad_serving:ultra_calphad_serving@127.0.0.1:55432/ultra_calphad_qualification
      ULTRA_CONTROL_TEST_MIGRATION_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:55432/ultra_calphad_qualification
      MATERIALS_CALPHAD_QUALIFICATION_CONFIRMED: dedicated-test-database
      MATERIALS_EXPECTED_GIT_SHA: ${{ github.sha }}
      MATERIALS_CALPHAD_LEDGER_OUTPUT_DIR: ${{ github.workspace }}/.tmp/calphad-ledger-qualification

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/controlplane/go.mod
          cache-dependency-path: backend/controlplane/go.sum

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v6

      - name: Provision non-owner CALPHAD serving role
        env:
          PGPASSWORD: postgres
        run: >-
          psql -h 127.0.0.1 -p 55432 -U postgres -d ultra_calphad_qualification
          -v ON_ERROR_STOP=1
          -c "CREATE ROLE ultra_calphad_serving LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD 'ultra_calphad_serving'"

      - name: Test fail-closed ledger evidence runner
        run: >-
          uv run --isolated --no-project --python 3.11 --with pytest==8.4.2
          pytest -q -p no:cacheprovider tests/test_calphad_ledger_gate.py

      - name: Test fail-closed cross-language qualification runner
        run: make calphad-cross-language-test

      - name: Qualify append-only ledger against dedicated PostgreSQL
        run: make calphad-ledger-qualification

      - name: Upload CALPHAD ledger qualification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: calphad-ledger-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.MATERIALS_CALPHAD_LEDGER_OUTPUT_DIR }}
          if-no-files-found: error
          retention-days: 30
