openapi: 3.0.3
info:
  title: BisQue Ultra Control Plane
  version: 0.1.0
paths:
  /v1/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/config/public:
    get:
      operationId: getPublicConfig
      responses:
        "200":
          description: Public config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfigResponse"
  /v1/auth/session:
    get:
      operationId: getAuthSession
      responses:
        "200":
          description: Auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
  /v1/auth/guest:
    post:
      operationId: continueAsGuest
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                affiliation: { type: string }
      responses:
        "200":
          description: Local guest auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
  /v1/auth/login:
    post:
      operationId: loginBisque
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Local BisQue-compatible auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
  /v1/auth/logout:
    post:
      operationId: logoutBisque
      responses:
        "200":
          description: Cleared local auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
  /v2/health:
    get:
      operationId: getV2Health
      responses:
        "200":
          description: Health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v2/config/public:
    get:
      operationId: getV2PublicConfig
      responses:
        "200":
          description: Public config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfigResponse"
  /v2/auth/session:
    get:
      operationId: getV2AuthSession
      responses:
        "200":
          description: Auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
  /v2/auth/guest:
    post:
      operationId: continueAsV2Guest
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                affiliation: { type: string }
      responses:
        "200":
          description: Local guest auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
  /v2/auth/request-account:
    post:
      operationId: requestV2Account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2AccountRequest"
      responses:
        "202":
          description: Account request created or already pending approval
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
  /v2/auth/login:
    post:
      operationId: loginV2Bisque
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Local BisQue-compatible auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
  /v2/auth/logout:
    post:
      operationId: logoutV2Bisque
      responses:
        "200":
          description: Cleared local auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
  /v2/threads:
    get:
      operationId: listThreads
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Thread list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ThreadListResponse"
    post:
      operationId: createThread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2ThreadCreateRequest"
      responses:
        "200":
          description: Created thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ThreadRecord"
  /v2/threads/{thread_id}:
    get:
      operationId: getThread
      parameters:
        - $ref: "#/components/parameters/ThreadID"
      responses:
        "200":
          description: Thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ThreadRecord"
    put:
      operationId: upsertThread
      parameters:
        - $ref: "#/components/parameters/ThreadID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2ThreadUpsertRequest"
      responses:
        "200":
          description: Upserted thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ThreadRecord"
    delete:
      operationId: deleteThread
      parameters:
        - $ref: "#/components/parameters/ThreadID"
      responses:
        "204":
          description: Thread deleted
  /v2/threads/{thread_id}/messages:
    get:
      operationId: listThreadMessages
      parameters:
        - $ref: "#/components/parameters/ThreadID"
        - name: limit
          in: query
          description: Optional newest-tail page size. When omitted with no before cursor, the endpoint returns the full thread for backward compatibility.
          schema: { type: integer, minimum: 1, default: 30 }
        - name: before
          in: query
          description: Message id cursor returned as next_cursor; returns the previous older page before that message.
          schema: { type: string }
      responses:
        "200":
          description: Thread messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ThreadMessageListResponse"
  /v2/threads/{thread_id}/runs:
    post:
      operationId: createRun
      parameters:
        - $ref: "#/components/parameters/ThreadID"
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
          description: Reuses the existing run for the same thread, user, and key instead of dispatching duplicate work.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2RunCreateRequest"
      responses:
        "200":
          description: Created run or stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2RunRecord"
            text/event-stream:
              schema:
                type: string
  /v2/uploads:
    post:
      operationId: uploadFiles
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: Uploaded files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2UploadFilesResponse"
  /v2/upload-sessions:
    post:
      operationId: createV2UploadSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2UploadSessionCreateRequest"
      responses:
        "200":
          description: Created or resumed upload session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2UploadSessionResponse"
  /v2/upload-sessions/{session_id}:
    get:
      operationId: getV2UploadSession
      parameters:
        - $ref: "#/components/parameters/UploadSessionID"
      responses:
        "200":
          description: Upload session status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2UploadSessionResponse"
  /v2/upload-sessions/{session_id}/files/{file_token}/chunks/{chunk_index}:
    put:
      operationId: uploadV2UploadSessionChunk
      parameters:
        - $ref: "#/components/parameters/UploadSessionID"
        - $ref: "#/components/parameters/UploadFileToken"
        - name: chunk_index
          in: path
          required: true
          schema: { type: integer, minimum: 0 }
        - name: offset
          in: query
          required: true
          schema: { type: integer, format: int64, minimum: 0 }
        - name: sha256
          in: query
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
      responses:
        "200":
          description: Uploaded and verified chunk
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2UploadChunkResponse"
  /v2/upload-sessions/{session_id}/files/{file_token}/complete:
    post:
      operationId: completeV2UploadSessionFile
      parameters:
        - $ref: "#/components/parameters/UploadSessionID"
        - $ref: "#/components/parameters/UploadFileToken"
      responses:
        "200":
          description: Completed file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2UploadSessionFileCompleteResponse"
  /v2/upload-sessions/{session_id}/finalize-bundle:
    post:
      operationId: finalizeV2UploadBundle
      parameters:
        - $ref: "#/components/parameters/UploadSessionID"
      responses:
        "200":
          description: Finalized directory-format upload bundles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2UploadBundleFinalizeResponse"
  /v2/upload-sessions/{session_id}/cancel:
    post:
      operationId: cancelV2UploadSession
      parameters:
        - $ref: "#/components/parameters/UploadSessionID"
      responses:
        "200":
          description: Canceled upload session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2UploadSessionResponse"
  /v2/upload-sessions/{session_id}/pause:
    post:
      operationId: pauseV2UploadSession
      parameters:
        - $ref: "#/components/parameters/UploadSessionID"
      responses:
        "200":
          description: Paused upload session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2UploadSessionResponse"
  /v2/upload-sessions/{session_id}/resume:
    post:
      operationId: resumeV2UploadSession
      parameters:
        - $ref: "#/components/parameters/UploadSessionID"
      responses:
        "200":
          description: Resumed upload session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2UploadSessionResponse"
  /v2/resource-collections:
    post:
      operationId: createV2ResourceCollection
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2ResourceCollectionCreateRequest"
      responses:
        "201":
          description: Created resource collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ResourceCollectionResponse"
    get:
      operationId: listV2ResourceCollections
      parameters:
        - name: collection_type
          in: query
          required: false
          schema: { type: string }
        - name: project_id
          in: query
          required: false
          schema: { type: string }
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          description: Collection lifecycle state to browse. Deleted collections are owner-only.
          schema:
            type: string
            enum: [active, deleted]
            default: active
        - name: limit
          in: query
          required: false
          schema: { type: integer }
        - name: offset
          in: query
          required: false
          schema: { type: integer }
      responses:
        "200":
          description: Resource collections
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ResourceCollectionsResponse"
  /v2/resource-collections/{collection_id}:
    patch:
      operationId: patchV2ResourceCollection
      parameters:
        - name: collection_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2ResourceCollectionPatchRequest"
      responses:
        "200":
          description: Updated a resource collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ResourceCollectionResponse"
    delete:
      operationId: deleteV2ResourceCollection
      parameters:
        - name: collection_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Soft-deleted a resource collection while preserving member resources
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ResourceCollectionResponse"
  /v2/resource-collections/{collection_id}/restore:
    post:
      operationId: restoreV2ResourceCollection
      parameters:
        - name: collection_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Restored a soft-deleted resource collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ResourceCollectionResponse"
  /v2/resource-collections/{collection_id}/shares:
    get:
      operationId: listV2ResourceCollectionShareGrants
      description: Owner-only list of a collection's share grants.
      parameters:
        - name: collection_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Collection share grants
        "404":
          description: Collection not found for this owner
    post:
      operationId: createV2ResourceCollectionShareGrants
      parameters:
        - name: collection_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2ResourceShareGrantCreateRequest"
      responses:
        "201":
          description: Created read grants for active resources in a collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ResourceCollectionShareGrantsCreateResponse"
  /v2/share-targets:
    get:
      operationId: listV2ShareTargets
      description: >-
        Pickable share grantees for the calling user: people in their own
        organization plus the organization itself as a single "everyone"
        target. Never a deployment-wide directory.
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Share targets matching the query
          content:
            application/json:
              schema:
                type: object
                properties:
                  targets:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: { type: string, enum: [user, org] }
                        grantee_user_id: { type: string }
                        grantee_org_id: { type: string }
                        label: { type: string }
                        detail: { type: string }
  /v2/resource-collections/{collection_id}/shares/{grant_id}:
    delete:
      operationId: revokeV2ResourceCollectionShareGrant
      description: >-
        Revoke a collection-level share grant; inherited per-resource grants
        cascade in the same operation.
      parameters:
        - name: collection_id
          in: path
          required: true
          schema: { type: string }
        - name: grant_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: The revoked collection share grant
        "404":
          description: Grant or collection not found for this owner
  /v2/resource-collections/{collection_id}/download:
    get:
      operationId: downloadV2ResourceCollection
      description: >-
        Stream the collection's member resources as a zip archive. Best-effort:
        unreadable members are skipped and reported in a SKIPPED.txt entry;
        bundle resources are included as directory trees. Direct members only —
        child folders are separate collections.
      parameters:
        - name: collection_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Zip archive of the collection's member resources
          headers:
            Content-Disposition:
              schema: { type: string }
              description: Attachment filename (collection name + .zip)
          content:
            application/zip:
              schema:
                type: string
                format: binary
        "404":
          description: Collection not found or not visible to the caller
  /v2/resource-collections/{collection_id}/resources:
    post:
      operationId: addV2ResourceCollectionResources
      parameters:
        - name: collection_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2ResourceCollectionAddResourcesRequest"
      responses:
        "200":
          description: Added resources to collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ResourceCollectionAddResourcesResponse"
    get:
      operationId: listV2ResourceCollectionResources
      parameters:
        - name: collection_id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer }
        - name: offset
          in: query
          required: false
          schema: { type: integer }
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: kind
          in: query
          required: false
          schema: { type: string }
        - name: source
          in: query
          required: false
          schema: { type: string }
        - name: project_id
          in: query
          required: false
          schema: { type: string }
        - name: tag
          in: query
          required: false
          description: Repeated tag filters. All supplied tags must match the resource.
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - name: tags
          in: query
          required: false
          description: Comma-separated tag filters. All supplied tags must match the resource.
          schema: { type: string }
        - name: descriptor
          in: query
          required: false
          description: Repeated scientific descriptor filters. All supplied descriptors must match resource labels, tags, extracted descriptors, captions, or summaries.
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - name: descriptors
          in: query
          required: false
          description: Comma-separated scientific descriptor filters. All supplied descriptors must match resource labels, tags, extracted descriptors, captions, or summaries.
          schema: { type: string }
        - name: metadata_filter
          in: query
          required: false
          description: Repeated structured metadata filters in path:operator:value form. Supported operators are eq, contains, exists, lt, lte, gt, and gte.
          style: form
          explode: true
          schema:
            type: array
            items: { type: string }
        - name: created_after
          in: query
          required: false
          description: Return resources created at or after this RFC3339 timestamp or YYYY-MM-DD date.
          schema: { type: string }
        - name: created_before
          in: query
          required: false
          description: Return resources created at or before this RFC3339 timestamp or YYYY-MM-DD date.
          schema: { type: string }
        - name: processing_status
          in: query
          required: false
          description: Filter resources by persisted Data Agent processing readiness.
          schema:
            type: string
            enum: [all, caption_ready, metadata_ready, tags_ready, qc_complete, dedupe_checked, organization_ready, data_agent_ready, needs_caption, needs_metadata, data_agent_failed]
        - name: sharing
          in: query
          required: false
          schema:
            type: string
            enum: [all, private, shared, shared_by_me, shared_with_me, public]
      responses:
        "200":
          description: Resources in collection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ResourceListResponse"
  /v2/resource-collections/{collection_id}/resources/{file_id}:
    delete:
      operationId: removeV2ResourceCollectionResource
      parameters:
        - name: collection_id
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: Removed the resource from the collection without deleting the resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ResourceCollectionRemoveResourcesResponse"
  /v2/dataset-snapshots:
    get:
      operationId: listV2DatasetSnapshots
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
        - name: q
          in: query
          required: false
          schema: { type: string }
        - name: project_id
          in: query
          required: false
          schema: { type: string }
        - name: source_collection_id
          in: query
          required: false
          schema: { type: string }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [active, deleted]
            default: active
      responses:
        "200":
          description: Immutable dataset snapshots visible to the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2DatasetSnapshotsResponse"
    post:
      operationId: createV2DatasetSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2DatasetSnapshotCreateRequest"
      responses:
        "201":
          description: Created immutable dataset snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2DatasetSnapshotResponse"
  /v2/dataset-snapshots/{snapshot_id}:
    get:
      operationId: getV2DatasetSnapshot
      parameters:
        - name: snapshot_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Immutable dataset snapshot manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2DatasetSnapshotResponse"
    delete:
      operationId: deleteV2DatasetSnapshot
      parameters:
        - name: snapshot_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Soft-deleted immutable dataset snapshot manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2DatasetSnapshotResponse"
  /v2/dataset-snapshots/{snapshot_id}/restore:
    post:
      operationId: restoreV2DatasetSnapshot
      parameters:
        - name: snapshot_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Restored immutable dataset snapshot manifest
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2DatasetSnapshotResponse"
  /v2/dataset-snapshots/{snapshot_id}/events:
    get:
      operationId: listV2DatasetSnapshotEvents
      parameters:
        - name: snapshot_id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 200 }
        - name: offset
          in: query
          required: false
          schema: { type: integer, default: 0 }
        - name: event_type
          in: query
          required: false
          schema: { type: string }
        - name: actor_user_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Dataset snapshot audit events visible to the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2DatasetSnapshotEventsResponse"
  /v2/dataset-snapshots/{snapshot_id}/shares:
    get:
      operationId: listV2DatasetSnapshotShareGrants
      parameters:
        - name: snapshot_id
          in: path
          required: true
          schema: { type: string }
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 200 }
        - name: status
          in: query
          required: false
          schema: { type: string }
      responses:
        "200":
          description: Dataset snapshot share grants owned by the current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2DatasetSnapshotShareGrantsResponse"
    post:
      operationId: createV2DatasetSnapshotShareGrant
      parameters:
        - name: snapshot_id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2DatasetSnapshotShareGrantCreateRequest"
      responses:
        "201":
          description: Created dataset snapshot share grant
          content:
            application/json:
