openapi: 3.0.3
info:
  title: BisQue Ultra Control Plane
  version: 0.1.0
paths:
  /v1/health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v1/config/public:
    get:
      operationId: getPublicConfig
      responses:
        "200":
          description: Public config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfigResponse"
  /v1/auth/session:
    get:
      operationId: getAuthSession
      responses:
        "200":
          description: Auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
  /v1/auth/guest:
    post:
      operationId: continueAsGuest
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                affiliation: { type: string }
      responses:
        "200":
          description: Local guest auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
  /v1/auth/login:
    post:
      operationId: loginBisque
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Local BisQue-compatible auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
  /v1/auth/logout:
    post:
      operationId: logoutBisque
      responses:
        "200":
          description: Cleared local auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
  /v2/health:
    get:
      operationId: getV2Health
      responses:
        "200":
          description: Health response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /v2/config/public:
    get:
      operationId: getV2PublicConfig
      responses:
        "200":
          description: Public config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicConfigResponse"
  /v2/auth/session:
    get:
      operationId: getV2AuthSession
      responses:
        "200":
          description: Auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
  /v2/auth/guest:
    post:
      operationId: continueAsV2Guest
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string }
                affiliation: { type: string }
      responses:
        "200":
          description: Local guest auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
  /v2/auth/login:
    post:
      operationId: loginV2Bisque
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        "200":
          description: Local BisQue-compatible auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
  /v2/auth/logout:
    post:
      operationId: logoutV2Bisque
      responses:
        "200":
          description: Cleared local auth session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionResponse"
  /v2/threads:
    get:
      operationId: listThreads
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: status
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Thread list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ThreadListResponse"
    post:
      operationId: createThread
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2ThreadCreateRequest"
      responses:
        "200":
          description: Created thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ThreadRecord"
  /v2/threads/{thread_id}:
    get:
      operationId: getThread
      parameters:
        - $ref: "#/components/parameters/ThreadID"
      responses:
        "200":
          description: Thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ThreadRecord"
    put:
      operationId: upsertThread
      parameters:
        - $ref: "#/components/parameters/ThreadID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2ThreadUpsertRequest"
      responses:
        "200":
          description: Upserted thread
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ThreadRecord"
  /v2/threads/{thread_id}/messages:
    get:
      operationId: listThreadMessages
      parameters:
        - $ref: "#/components/parameters/ThreadID"
      responses:
        "200":
          description: Thread messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ThreadMessageListResponse"
  /v2/threads/{thread_id}/runs:
    post:
      operationId: createRun
      parameters:
        - $ref: "#/components/parameters/ThreadID"
        - name: Idempotency-Key
          in: header
          required: false
          schema: { type: string }
          description: Reuses the existing run for the same thread, user, and key instead of dispatching duplicate work.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2RunCreateRequest"
      responses:
        "200":
          description: Created run or stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2RunRecord"
            text/event-stream:
              schema:
                type: string
  /v2/uploads:
    post:
      operationId: uploadFiles
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: Uploaded files
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2UploadFilesResponse"
  /v2/uploads/{file_id}/preview:
    get:
      operationId: getUploadPreview
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: Upload preview bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /v2/uploads/{file_id}/viewer:
    get:
      operationId: getUploadViewer
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: Upload viewer metadata
          content:
            application/json:
              schema:
                type: object
  /v2/uploads/{file_id}/display:
    get:
      operationId: getUploadDisplay
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: Upload display bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /v2/uploads/{file_id}/slice:
    get:
      operationId: getUploadSlice
      parameters:
        - $ref: "#/components/parameters/FileID"
        - name: axis
          in: query
          schema: { type: string }
        - name: z
          in: query
          schema: { type: integer, minimum: 0 }
        - name: y
          in: query
          schema: { type: integer, minimum: 0 }
        - name: x
          in: query
          schema: { type: integer, minimum: 0 }
        - name: c
          in: query
          schema: { type: integer, minimum: 0 }
        - name: t
          in: query
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: Upload slice bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /v2/uploads/{file_id}/caption:
    get:
      operationId: getUploadCaption
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: Upload caption
          content:
            application/json:
              schema:
                type: object
                required: [file_id, caption, source]
                properties:
                  file_id: { type: string }
                  caption: { type: string }
                  source:
                    type: string
                    enum: [fallback, llm, cache]
  /v2/uploads/from-bisque:
    post:
      operationId: importV2BisqueResources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                resources:
                  type: array
                  items: { type: string }
      responses:
        "501":
          description: BisQue resource import is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2NotConfiguredResponse"
  /v2/resources:
    get:
      operationId: listResources
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: q
          in: query
          schema: { type: string }
        - name: kind
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Resource list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ResourceListResponse"
  /v2/resources/{file_id}:
    get:
      operationId: getResource
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: Resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ResourceResponse"
    delete:
      operationId: deleteResource
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: Deleted resource
          content:
            application/json:
              schema:
                type: object
                required: [deleted, file_id]
                properties:
                  deleted: { type: boolean }
                  file_id: { type: string }
  /v2/resources/{file_id}/thumbnail:
    get:
      operationId: getResourceThumbnail
      parameters:
        - $ref: "#/components/parameters/FileID"
      responses:
        "200":
          description: Resource thumbnail bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /v2/runs:
    get:
      operationId: listRuns
      parameters:
        - name: thread_id
          in: query
          schema: { type: string }
        - name: status
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 100 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Run list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2RunListResponse"
  /v2/runs/{run_id}:
    get:
      operationId: getRun
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2RunRecord"
  /v2/runs/{run_id}/resume:
    post:
      operationId: resumeRun
      parameters:
        - $ref: "#/components/parameters/RunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2RunResumeRequest"
      responses:
        "200":
          description: Resumed run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2RunRecord"
  /v2/runs/{run_id}/cancel:
    post:
      operationId: cancelRun
      parameters:
        - $ref: "#/components/parameters/RunID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2RunCancelRequest"
      responses:
        "200":
          description: Canceled run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2RunRecord"
  /v2/runs/{run_id}/lease:
    post:
      operationId: acquireRunLease
      parameters:
        - $ref: "#/components/parameters/RunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2RunLeaseRequest"
      responses:
        "200":
          description: Acquired run lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2RunLeaseRecord"
        "409":
          description: Run is already leased or terminal
    patch:
      operationId: renewRunLease
      parameters:
        - $ref: "#/components/parameters/RunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2RunLeaseRequest"
      responses:
        "200":
          description: Renewed run lease
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2RunLeaseRecord"
        "409":
          description: Lease token is stale or invalid
    delete:
      operationId: releaseRunLease
      parameters:
        - $ref: "#/components/parameters/RunID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2RunLeaseRequest"
      responses:
        "200":
          description: Released run lease
          content:
            application/json:
              schema:
                type: object
                required: [released]
                properties:
                  released: { type: boolean }
        "409":
          description: Lease token is stale or invalid
  /v2/runs/{run_id}/events:
    get:
      operationId: listRunEvents
      parameters:
        - $ref: "#/components/parameters/RunID"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
        - name: after_sequence
          in: query
          description: Return events with sequence numbers greater than this cursor. Use 0 to page from the beginning of a long run.
          schema: { type: integer, minimum: 0 }
        - name: stream
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Run events or event stream
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2RunEventsResponse"
            text/event-stream:
              schema:
                type: string
  /v2/runs/{run_id}/artifacts:
    get:
      operationId: listRunArtifacts
      parameters:
        - $ref: "#/components/parameters/RunID"
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        "200":
          description: Run artifacts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ArtifactListResponse"
  /v2/runs/{run_id}/artifacts/download:
    get:
      operationId: downloadRunArtifactByPath
      parameters:
        - $ref: "#/components/parameters/RunID"
        - name: path
          in: query
          required: true
          schema: { type: string }
          description: Run-relative artifact path. Path traversal and absolute paths are rejected.
      responses:
        "200":
          description: Artifact file bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "400":
          description: Missing or unsafe artifact path
        "404":
          description: Artifact path not found
  /v2/artifacts/{artifact_id}:
    get:
      operationId: getArtifact
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Artifact
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2ArtifactResponse"
  /v2/artifacts/{artifact_id}/download:
    get:
      operationId: downloadArtifact
      parameters:
        - name: artifact_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Artifact file bytes
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
  /v2/workers/heartbeat:
    post:
      operationId: postV2WorkerHeartbeat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2WorkerHeartbeatRequest"
      responses:
        "200":
          description: Worker heartbeat accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2WorkerHeartbeatRecord"
        "400":
          description: Missing or invalid worker heartbeat
  /v2/admin/overview:
    get:
      operationId: getV2AdminOverview
      parameters:
        - name: top_users
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 8 }
        - name: issue_limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 12 }
      responses:
        "200":
          description: Local admin overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2AdminOverviewResponse"
  /v2/admin/orgs:
    get:
      operationId: listV2AdminOrganizations
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Local admin organizations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2AdminOrganizationListResponse"
    post:
      operationId: createV2AdminOrganization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2AdminCreateOrganizationRequest"
      responses:
        "201":
          description: Created admin-managed organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2AdminOrganization"
  /v2/admin/users:
    get:
      operationId: listV2AdminUsers
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Local admin users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2AdminUserListResponse"
    post:
      operationId: createV2AdminUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/V2AdminCreateUserRequest"
      responses:
        "201":
          description: Created admin-managed user account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2AdminUserAccount"
  /v2/admin/users/{user_id}:
    delete:
      operationId: deleteV2AdminUser
      parameters:
        - name: user_id
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Soft-disabled admin-managed user account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2AdminUserAccount"
  /v2/admin/runs:
    get:
      operationId: listV2AdminRuns
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000, default: 200 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: status
          in: query
          schema: { type: string }
        - name: user_id
          in: query
          schema: { type: string }
        - name: q
          in: query
          schema: { type: string }
      responses:
        "200":
          description: Local admin runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2AdminRunListResponse"
  /v2/admin/issues:
    get:
      operationId: listV2AdminIssues
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 500, default: 25 }
      responses:
        "200":
          description: Local admin issues
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2AdminIssueListResponse"
  /v2/admin/runs/{run_id}/cancel:
    post:
      operationId: cancelV2AdminRun
      parameters:
        - $ref: "#/components/parameters/RunID"
      responses:
        "200":
          description: Admin run cancellation result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2AdminRunActionResponse"
  /v2/admin/runs/{run_id}/requeue:
    post:
      operationId: requeueV2AdminRun
      parameters:
        - $ref: "#/components/parameters/RunID"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200":
          description: Admin run recovery dispatch result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2AdminRunActionResponse"
        "409":
          description: Run is terminal and cannot be requeued
  /v2/admin/conversations/{conversation_id}:
    delete:
      operationId: deleteV2AdminConversation
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string }
        - name: user_id
          in: query
          required: false
          schema: { type: string }
      responses:
        "501":
          description: Admin conversation deletion is not configured in the Go control plane yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2NotConfiguredResponse"
  /v2/training/models:
    get:
      operationId: listV2TrainingModels
      responses:
        "200":
          description: Training model descriptors
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2TrainingModelsResponse"
  /v2/training/prairie/status:
    get:
      operationId: getV2PrairieStatus
      responses:
        "200":
          description: Prairie training status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PrairieStatusResponse"
  /v2/training/prairie/retrain-requests:
    get:
      operationId: listV2PrairieRetrainRequests
      responses:
        "200":
          description: Prairie retrain requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2PrairieRetrainListResponse"
  /v2/training/prairie/sync:
    post:
      operationId: syncV2PrairieActiveLearning
      responses:
        "501":
          description: Prairie active-learning sync is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2NotConfiguredResponse"
  /v2/training/prairie/benchmark/run:
    post:
      operationId: runV2PrairieBenchmark
      responses:
        "501":
          description: Prairie benchmark jobs are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2NotConfiguredResponse"
  /v2/training/prairie/retrain-request:
    post:
      operationId: requestV2PrairieRetrain
      responses:
        "501":
          description: Prairie retraining jobs are not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2NotConfiguredResponse"
  /v2/training/datasets:
    get:
      operationId: listV2TrainingDatasets
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 1000 }
      responses:
        "200":
          description: Training datasets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2TrainingDatasetListResponse"
    post:
      operationId: createV2TrainingDataset
      responses:
        "501":
          description: Training dataset creation is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2NotConfiguredResponse"
  /v2/training/datasets/{dataset_id}:
    get:
      operationId: getV2TrainingDataset
      parameters:
