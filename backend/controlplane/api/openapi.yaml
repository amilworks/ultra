components:
  parameters:
    ThreadID:
      name: thread_id
      in: path
      required: true
      schema: { type: string }
    RunID:
      name: run_id
      in: path
      required: true
      schema: { type: string }
    FileID:
      name: file_id
      in: path
      required: true
      schema: { type: string }
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
    HealthResponse:
      type: object
      required: [status, ts]
      properties:
        status: { type: string }
        ts: { type: string }
    PublicConfigResponse:
      type: object
      additionalProperties: true
      properties:
        app_name: { type: string }
        app_version: { type: string }
        admin_enabled: { type: boolean }
        features:
          type: object
          additionalProperties: { type: boolean }
    AuthSessionResponse:
      type: object
      required: [authenticated, user]
      properties:
        authenticated: { type: boolean }
        username: { type: string, nullable: true }
        mode: { type: string, nullable: true }
        is_admin: { type: boolean, nullable: true }
        guest_profile:
          nullable: true
          $ref: "#/components/schemas/JsonObject"
        user:
          nullable: true
          $ref: "#/components/schemas/JsonObject"
    V2NotConfiguredResponse:
      type: object
      required: [error, status, service]
      properties:
        error: { type: string }
        status: { type: string, enum: [not_configured] }
        service: { type: string }
    V2AdminPlatformKpis:
      type: object
      additionalProperties: true
      properties:
        total_users: { type: integer }
        active_users_24h: { type: integer }
        total_conversations: { type: integer }
        conversations_started_24h: { type: integer }
        total_messages: { type: integer }
        messages_last_24h: { type: integer }
        user_messages_last_24h: { type: integer }
        assistant_messages_last_24h: { type: integer }
        total_runs: { type: integer }
        runs_last_24h: { type: integer }
        success_rate_last_24h: { type: number }
        running_runs: { type: integer }
        stale_running_runs: { type: integer }
        failed_runs_24h: { type: integer }
        total_uploads: { type: integer }
        soft_deleted_uploads: { type: integer }
        total_storage_bytes: { type: integer, format: int64 }
        avg_messages_per_conversation: { type: number }
    V2AdminUsageBucket:
      type: object
      additionalProperties: true
      properties:
        bucket_start: { type: string }
        runs_total: { type: integer }
        runs_succeeded: { type: integer }
        runs_failed: { type: integer }
        uploads: { type: integer }
        new_users: { type: integer }
