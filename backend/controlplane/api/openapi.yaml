  /v2/bisque/search:
    post:
      operationId: searchBisqueResources
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                resource_type: { type: string, default: image }
                tag_query: { type: string }
                tag_order:
                  type: string
                  description: BisQue data_service tag_order passed through for server-side ordering.
                query: { type: string }
                name_contains:
                  type: string
                  description: Filename/resource text fragment verified against returned resources.
                extensions:
                  type: array
                  items: { type: string }
                  description: File extensions such as png, jpg, nii, nii.gz, or nifti verified against returned resources.
                file_extensions:
                  type: array
                  items: { type: string }
                  description: Alias for extensions.
                metadata_filters:
                  type: array
                  description: >-
                    Tag comparisons evaluated client-side against view=full tags. Numeric
                    ops (gt/gte/lt/lte) are compared numerically, avoiding BisQue's lexical
                    tag comparison which mis-ranks numbers (e.g. age 7 > age 50).
                  items:
                    type: object
                    required: [tag]
                    properties:
                      tag: { type: string }
                      op:
                        type: string
                        enum: [eq, ne, gt, gte, lt, lte, contains]
                        default: eq
                      value: { type: string }
                scope:
                  type: string
                  default: owner,shared
                  description: BisQue visibility scope. Use owner for the linked user's own resources.
                sort:
                  type: string
                  description: Convenience sort such as recent, oldest, name, or name_desc.
                limit: { type: integer, minimum: 1, maximum: 100, default: 25 }
                offset: { type: integer, minimum: 0, default: 0 }
                count_all:
                  type: boolean
                  default: false
                  description: Page through the BisQue list to return the full inventory count when the upstream response omits a total.
      responses:
        "200":
          description: BisQue resources visible to the linked account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2BisqueSearchResponse"
        "501":
          description: BisQue integration is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/V2NotConfiguredResponse"
