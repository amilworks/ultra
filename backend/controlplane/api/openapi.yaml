components:
  parameters:
    ThreadID:
      name: thread_id
      in: path
      required: true
      schema: { type: string }
    RunID:
      name: run_id
      in: path
      required: true
      schema: { type: string }
    FileID:
      name: file_id
      in: path
      required: true
      schema: { type: string }
    UploadSessionID:
      name: session_id
      in: path
      required: true
      schema: { type: string }
    UploadFileToken:
      name: file_token
      in: path
      required: true
      schema: { type: string }
    UltraWorkerRunID:
      name: X-Ultra-Run-Id
      in: header
      required: true
      description: Must exactly equal the run_id path parameter.
      schema: { type: string, minLength: 1 }
    UltraWorkerID:
      name: X-Ultra-Worker-Id
      in: header
      required: true
      description: Must exactly equal the worker id on the active run lease.
      schema: { type: string, minLength: 1 }
    UltraRunLeaseToken:
      name: X-Ultra-Run-Lease-Token
      in: header
      required: true
      description: Opaque active run-lease secret compared in constant time by the server.
      schema: { type: string, minLength: 1 }
    ConditionalUltraWorkerRunID:
      name: X-Ultra-Run-Id
      in: header
      required: false
      description: Required when the UltraWorkerToken security alternative is used.
      schema: { type: string, minLength: 1 }
    ConditionalUltraWorkerID:
      name: X-Ultra-Worker-Id
      in: header
      required: false
      description: Required when the UltraWorkerToken security alternative is used; must equal the active lease worker.
      schema: { type: string, minLength: 1 }
    ConditionalUltraRunLeaseToken:
      name: X-Ultra-Run-Lease-Token
      in: header
      required: false
      description: Required when the UltraWorkerToken security alternative is used; compared with the active lease in constant time.
      schema: { type: string, minLength: 1 }
    OptionalUltraBisqueSessionID:
      name: X-Ultra-Bisque-Session-Id
      in: header
      required: false
      description: Optional opaque linked-session selector; worker use is accepted only when it matches the run's server-stamped account binding.
      schema: { type: string, minLength: 1 }
  securitySchemes:
    UltraWorkerToken:
      type: apiKey
      in: header
      name: X-Ultra-Worker-Token
      description: Configured control-plane credential for trusted Deep Agents workers.
    UltraWorkOSSession:
      type: apiKey
      in: cookie
      name: ultra_workos_session
      description: Sealed approved WorkOS session cookie used by interactive production callers.
  schemas:
    JsonObject:
      type: object
      additionalProperties: true
    HealthResponse:
      type: object
      required: [status, ts]
      properties:
        status: { type: string }
        ts: { type: string }
    PublicConfigResponse:
      type: object
      additionalProperties: true
      properties:
        app_name: { type: string }
        app_version: { type: string }
        admin_enabled: { type: boolean }
        bisque_root: { type: string, nullable: true }
        bisque_browser_url: { type: string, nullable: true }
        bisque_auth_enabled: { type: boolean, nullable: true }
        bisque_guest_enabled: { type: boolean, nullable: true }
        bisque_urls:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            home: { type: string, nullable: true }
            images: { type: string, nullable: true }
            datasets: { type: string, nullable: true }
            tables: { type: string, nullable: true }
        features:
          type: object
          additionalProperties: { type: boolean }
    AuthSessionResponse:
      type: object
      required: [authenticated]
      properties:
        authenticated: { type: boolean }
        username: { type: string, nullable: true }
        mode: { type: string, enum: [bisque, guest, workos], nullable: true }
        provider: { type: string, nullable: true }
        account_status: { type: string, nullable: true }
        account_email: { type: string, nullable: true }
        account_user_id: { type: string, nullable: true }
        message: { type: string, nullable: true }
        authorization_url: { type: string, nullable: true }
        logout_url: { type: string, nullable: true }
        is_admin: { type: boolean, nullable: true }
        bisque_linked: { type: boolean, nullable: true }
        guest_profile:
          nullable: true
          $ref: "#/components/schemas/JsonObject"
        user:
          nullable: true
          $ref: "#/components/schemas/JsonObject"
    V2AccountRequest:
      type: object
      additionalProperties: false
      required: [name, email, affiliation]
      properties:
        name: { type: string }
        email: { type: string }
        affiliation: { type: string }
    V2NotConfiguredResponse:
      type: object
      required: [error, status, service]
      properties:
        error: { type: string }
        status: { type: string, enum: [not_configured] }
        service: { type: string }
    V2AdminPlatformKpis:
      type: object
      additionalProperties: true
      properties:
        total_users: { type: integer }
        active_users_24h: { type: integer }
        total_conversations: { type: integer }
        conversations_started_24h: { type: integer }
        total_messages: { type: integer }
        messages_last_24h: { type: integer }
        user_messages_last_24h: { type: integer }
        assistant_messages_last_24h: { type: integer }
        total_runs: { type: integer }
