[project]
name = "ultra-deepagents-runtime"
version = "0.1.0"
description = "Python Deep Agents runtime for BisQue Ultra"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.12,<0.7",
    "langchain-core>=1.4.8,<2",
    "langchain-openai>=1.2.0,<2",
    "langgraph>=1.1.3,<2",
    "langgraph-checkpoint>=4.1.0,<5",
    "httpx>=0.28.0,<1",
    "nats-py>=2.9.0,<3",
    "pillow>=10.0.0,<13",
    "psycopg[binary]>=3.2.0,<4",
    "pymupdf>=1.24.0,<2",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # analysis/client.py imports requests at module level; declare it explicitly
    # instead of relying on transitive resolution (langsmith / google-genai).
    "requests>=2.31.0,<3",
]

[project.optional-dependencies]
# dev pulls in the imaging deps (numpy/fastapi/lxml/uvicorn) so the imaging test
# suite collects+runs under a clean `uv run --extra dev` (as CI does) — without
# them, test_imaging_* fail to import numpy.
dev = ["pytest>=8.0.0", "ultra-deepagents-runtime[imaging]"]
imaging = [
    "numpy>=1.26.0,<3",
    "lxml>=5.0.0,<6",
    "fastapi>=0.110.0,<1",
    "uvicorn>=0.29.0,<1",
    # HDF5 data viewer (imaging/hdf5.py): h5py-backed dataset/materials/slice/atlas/
    # scalar-volume/histogram/table endpoints + kind:"hdf5" viewerinfo detection. Ships
    # a prebuilt manylinux/macos wheel bundling libhdf5, so no system HDF5 dev headers
    # are needed at build time. 3.11+ has firm numpy-2 wheels (the imaging extra resolves
    # numpy>=2 via bioio-lif).
    "h5py>=3.11.0,<4",
    # bioio transcode fallback for formats libbioimage cannot decode: read via bioio ->
    # write OME-TIFF -> pyramid (imaging/transcode.py). Used ONLY in the batch convert
    # lane, never on the serving hot path.
    #
    # PLUGIN SELECTION: bioio + the readers for formats libbioimage can't decode (.lif/.dv)
    # plus .czi (preferentially routed to bioio — it assembles Zeiss mosaics/scenes that
    # libbioimage rendered blocky/unstitched; see PREFER_BIOIO_EXTENSIONS in imaging/job.py).
    # bioio-bioformats is excluded by request (Java/scyjava — slow); the tiff/ome-tiff/imageio
    # plugins are omitted as pure redundancy (libbioimage decodes those natively).
    #
    # bioio-sldy (.sldy) is EXCLUDED: it requires numpy<2, but bioio-lif (via readlif>=0.6.6)
    # requires numpy>=2 — they are mutually exclusive (uv: "bioio-lif and bioio-sldy are
    # incompatible"). .lif is the priority, so numpy>=2 wins and sldy is dropped.
    #
    # bioio is PINNED to 3.3.0: pip's backtracking resolver otherwise explores old bioio
    # (1.x), which caps tifffile<2025.2.18 and conflicts with the modern stack, thrashing for
    # hundreds of metadata fetches under QEMU. 3.3.0 resolves cleanly with lif+dv+czi against
    # modern numpy2/pandas3/tifffile/dask (verified with uv's resolver). Leave the heavy
    # transitive deps (pandas/dask/tifffile/zarr) UNPINNED — bioio 3.3.0 constrains them and
    # every one resolves to a prebuilt cp312 wheel (no compiler).
    "tifffile>=2024.1.0",
    "bioio==3.3.0",
    "bioio-lif>=1.4.2,<2",   # Leica .lif  (libbioimage's leica reader is non-functional)
    "bioio-dv>=1.2.0,<2",    # DeltaVision .dv / .r3d  (mrc backend)
    "bioio-czi>=2.7.2,<3",   # Zeiss .czi (preferred over libbioimage for mosaics)
    "bioio-nd2>=1.8.0,<2",   # Nikon .nd2 (no libbioimage reader; the frontend accepts .nd2 uploads)
    "aicspylibczi>=3.3.1",   # czi native reader — pin to a cp312-wheel release (no compiler)
    "pylibczirw>=6.0.1",     # czi native reader — pin to a cp312-wheel release (no compiler)
]
# ngff-service: native OME-Zarr (NGFF) serving. Deliberately SEPARATE from [imaging] —
# no libbioimage, no bioio, no Java — a light, conflict-free image. zarr>=2.18 picks
# zarr 3.x which reads both Zarr v2 and v3 stores; numcodecs brings blosc/zstd codecs.
ngff = [
    "numpy>=1.26.0,<3",
    "zarr>=2.18,<4",
    "numcodecs>=0.12.0",
    "Pillow>=10.0.0",
    "fastapi>=0.110.0,<1",
    "uvicorn>=0.29.0,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ultra_deepagents"]

# Ship the agent skills (SKILL.md protocols) INSIDE the wheel so a pip-installed
# worker (the containerized deployment) finds them next to the package — otherwise
# resolve_skills_root falls back to a source-tree path that does not exist in
# site-packages and the agent silently runs with no skills.
[tool.hatch.build.targets.wheel.force-include]
"skills" = "ultra_deepagents/skills"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
