[project]
name = "ultra-deepagents-runtime"
version = "0.1.0"
description = "Python Deep Agents runtime for BisQue Ultra"
requires-python = ">=3.11"
dependencies = [
    "deepagents>=0.6.8,<0.7",
    "langchain-core>=1.4.0,<2",
    "langchain-openai>=1.2.0,<2",
    "langgraph>=1.1.3,<2",
    "langgraph-checkpoint>=4.1.0,<5",
    "httpx>=0.28.0,<1",
    "nats-py>=2.9.0,<3",
    "pillow>=10.0.0,<13",
    "psycopg[binary]>=3.2.0,<4",
    "pymupdf>=1.24.0,<2",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
]

[project.optional-dependencies]
# dev pulls in the imaging deps (numpy/fastapi/lxml/uvicorn) so the imaging test
# suite collects+runs under a clean `uv run --extra dev` (as CI does) — without
# them, test_imaging_* fail to import numpy.
dev = ["pytest>=8.0.0", "ultra-deepagents-runtime[imaging]"]
imaging = [
    "numpy>=1.26.0,<3",
    "lxml>=5.0.0,<6",
    "fastapi>=0.110.0,<1",
    "uvicorn>=0.29.0,<1",
]
rarespot = [
    "matplotlib>=3.8.0,<4",
    "ipython>=8.0.0,<10",
    "numpy>=1.26.0,<3",
    "opencv-python-headless>=4.8.0,<5",
    "pandas>=2.0.0,<3",
    "psutil>=5.9.0,<8",
    "PyYAML>=6.0.0,<7",
    "requests>=2.31.0,<3",
    "scipy>=1.11.0,<2",
    "seaborn>=0.13.0,<1",
    "thop>=0.1.1.post2209072238,<1",
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "tqdm>=4.66.0,<5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ultra_deepagents"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
