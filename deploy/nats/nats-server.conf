# BisQue Ultra NATS JetStream server config.
# Mounted read-only into the ultra-nats container at /etc/nats/nats-server.conf.
#
# Auth: a single token, supplied via the ULTRA_NATS_TOKEN environment variable
# (from /etc/ultra/nats.env). Clients authenticate with nats://:<token>@host:4222.
# Roll the token out to the control-plane (ULTRA_CONTROL_NATS_URL) and every
# worker (ULTRA_CONTROL_NATS_URL / ULTRA_NATS_URL) in the same change. On a shared
# campus L2 this token is defense-in-depth alongside the host firewall; upgrade to
# nkey/creds + TLS when exposure widens.
port: 4222
http: 8222

jetstream {
  store_dir: "/data"
  # Hard ceiling so the ULTRA_RUNS stream can never fill the node's local disk.
  max_file_store: 5GB
  max_memory_store: 256MB
}

authorization {
  token: $ULTRA_NATS_TOKEN
}
