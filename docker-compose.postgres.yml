# Standalone dev-database side-stack for the NATIVE path (restart-control-stack /
# make postgres-*). It MUST declare its own project name: compose derives the
# project from the directory otherwise, which is also what docker-compose.yml
# uses — so a plain `make down` (or any `docker compose down` in this repo) would
# sweep away this container even though it belongs to a different stack. The data
# itself is a bind mount (./data/postgres) and survives regardless, but losing the
# container mid-session is a confusing footgun. Keep this name distinct.
name: bisque-ultra-devdb

services:
  postgres:
    image: postgres:18-alpine
    container_name: bisque-ultra-postgres
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - track_wal_io_timing=on
      - -c
      - log_temp_files=65536
      - -c
      - wal_compression=lz4
      - -c
      - default_toast_compression=lz4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bisque_ultra}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bisque_ultra}"]
      interval: 5s
      timeout: 3s
      retries: 20
