# BisQue Ultra — local PRODUCTION-PARITY stack (`make up`).
#
#   docker compose up --build
#
# This file deliberately mirrors the deployed production topology, so a local run
# is evidence about a production rollout. It brings up every service production
# runs: Postgres, NATS (JetStream, token-authed), the libbioimage image service +
# its convert worker, the NGFF service, the Go control plane, MULTIPLE Deep Agents
# workers sharing one NATS durable, and the built SPA served by an edge that
# mirrors the production reverse proxy (same-origin API, same security headers,
# same cache contract).
#
# Parity settings that matter (change them and you are no longer testing prod):
#   ENVIRONMENT=production   — config.Validate() returns early otherwise, so the
#                              entire production requirement block goes untested.
#   worker replicas = 2      — exercises competing consumers / lease redelivery.
#   NATS token auth          — production requires a token.
#
# Deliberate, documented differences from production (everything else should
# match): dev auth instead of WorkOS (opt in with ULTRA_AUTH_PROVIDER=workos),
# plain http instead of TLS+HSTS, and one host instead of the multi-node fleet.
#
# Talks to any OpenAI-compatible model server you run on the HOST (Ollama or
# vLLM) — by default http://host.docker.internal:11434/v1 with `gpt-oss:20b`.
# Override the model (and a few ports) without touching the app's .env via shell
# vars or an --env-file, e.g.:
#   ULTRA_MODEL_NAME=qwen2.5:14b-instruct docker compose up --build
#   docker compose --env-file .env.docker up --build

services:
  postgres:
    image: postgres:18-alpine
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.max=10000
      - -c
      - pg_stat_statements.track=all
      - -c
      - track_io_timing=on
      - -c
      - track_wal_io_timing=on
      - -c
      - log_temp_files=65536
      - -c
      - wal_compression=lz4
      - -c
      - default_toast_compression=lz4
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bisque_ultra
    volumes:
      - ultra-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bisque_ultra"]
      interval: 5s
      timeout: 5s
      retries: 20

  nats:
    image: nats:2.10-alpine
    # -sd persists JetStream to a named volume so durable run/job state survives
    # `docker compose down` (without a store dir + volume it is lost on restart).
    # --auth mirrors production, where NATS requires a token. Clients MUST use the
    # userinfo form `nats://<token>@host` (NO colon) — the `nats://:<token>@host`
    # form sends the token as an empty-user PASSWORD and token auth rejects it.
    command:
      ["-js", "-sd", "/data", "-m", "8222", "--auth", "${ULTRA_NATS_TOKEN:-local-dev-nats-token}"]
    volumes:
      - ultra-nats:/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 20

  image-service:
    build:
      context: backend/deepagents_runtime
      dockerfile: Dockerfile.imaging
      args:
        # Pin to a known-good BioImageConvert commit for reproducible builds; the
        # upstream default branch can drift. Override BIOIMAGE_REF in .env.docker.
        BIOIMAGE_REF: ${BIOIMAGE_REF:-main}
    image: ultra-image-service:local
    platform: linux/amd64 # the libbioimage engine is x86/SSE (emulated on arm64)
    environment:
      # Decode pool size — the scarce shared resource. Was hardcoded to 2 (the local
      # bottleneck); tune per host. Each worker is one emulated libbioimage engine.
      ULTRA_IMAGE_WORKERS: "${ULTRA_IMAGE_WORKERS:-4}"
      # Keep this many workers free for interactive /slice + /tile while a bulk
      # atlas/scalar-volume read fans across the rest — prevents the viewer lockup.
      ULTRA_IMAGE_INTERACTIVE_RESERVE: "${ULTRA_IMAGE_INTERACTIVE_RESERVE:-1}"
      # The upload volume is local disk here, so the NFS-avoidance pyramid COPY
      # cache is pure overhead (a 22GB /tmp pile + a slow whole-pyramid copy on the
      # first tile). Disable it locally; prod (NFS) keeps it on via its own env.
      ULTRA_IMGSVC_LOCAL_PYRAMID_CACHE: "${ULTRA_IMGSVC_LOCAL_PYRAMID_CACHE:-0}"
    mem_limit: ${ULTRA_IMAGE_MEM_LIMIT:-12g}
    volumes:
      - ultra-uploads:/data/uploads
    ports:
      - "${IMAGE_SERVICE_PORT:-8099}:8090"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8090/healthz').status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30

  image-convert-worker:
    image: ultra-image-service:local # same image, worker role
    platform: linux/amd64
    command: ["python", "-m", "ultra_deepagents.image_convert_worker"]
    mem_limit: ${ULTRA_IMAGE_CONVERT_MEM_LIMIT:-12g}
    environment:
      ULTRA_CONTROL_NATS_URL: nats://${ULTRA_NATS_TOKEN:-local-dev-nats-token}@nats:4222
      ULTRA_CONTROL_NATS_IMAGE_JOBS_SUBJECT: ultra.data_agent.jobs
      ULTRA_CONTROL_NATS_IMAGE_WORKER_DURABLE: ultra-image-convert-worker
      # Slice-video jobs fetch owner-scoped frames through the same strict control-plane
      # renderer used by Lens; the worker credential stays in service configuration.
      ULTRA_CONTROL_BASE_URL: http://control-plane:8000
      ULTRA_CONTROL_WORKER_TOKEN: ${ULTRA_WORKER_TOKEN:-local-dev-worker-token}
    volumes:
      - ultra-uploads:/data/uploads
    depends_on:
      nats:
        condition: service_healthy
      image-service:
        condition: service_started
      # MUST start after the control plane. The control plane owns
      # ultra.data_agent.jobs as a subject of its ULTRA_RUNS stream
      # (ULTRA_CONTROL_NATS_DATA_AGENT_JOBS_SUBJECT); if this worker wins the race
      # it creates its own stream claiming that subject and the control plane then
      # dies with "nats: subjects overlap with an existing stream". Production is
      # never exposed to that race because the control plane is long-lived.
      control-plane:
        condition: service_started

  # OME-Zarr (NGFF) native serving — a stateless sibling to image-service, purpose-built
  # for chunked multiscale zarr (blosc/zstd decode releases the GIL → thread-scalable; no
  # Java/libbioimage, ~480MB). The control plane routes .ome.zarr resources here; it serves
  # only the visible tiles/chunks so a 1 TB store is never fully read. Scale horizontally on
  # the 128-core serving tier (docker compose up --scale ngff-service=N behind a local LB, or
  # systemd ngff-service@.service replicas) — it is stateless and shares the upload volume.
  ngff-service:
    build:
      context: backend/deepagents_runtime
      dockerfile: Dockerfile.ngff
    image: ultra-ngff-service:local
    environment:
      ULTRA_NGFF_WORKERS: "${ULTRA_NGFF_WORKERS:-2}"
      # Process-wide decoded-plane cache. This is one 256 MiB ceiling per worker,
      # not 256 MiB multiplied by every entry in the open-image metadata LRU.
      ULTRA_NGFF_DECODE_CACHE_BYTES: "${ULTRA_NGFF_DECODE_CACHE_BYTES:-268435456}"
      ULTRA_NGFF_DECODE_CACHE_PLANE_BYTES: "${ULTRA_NGFF_DECODE_CACHE_PLANE_BYTES:-50331648}"
      ULTRA_NGFF_DECODE_CACHE_ENTRIES: "${ULTRA_NGFF_DECODE_CACHE_ENTRIES:-4096}"
      ULTRA_NGFF_TILE_THRESHOLD: "${ULTRA_NGFF_TILE_THRESHOLD:-2048}"
      ULTRA_NGFF_INTENSITY_RANGE_MAX_ELEMENTS: "${ULTRA_NGFF_INTENSITY_RANGE_MAX_ELEMENTS:-5000000}"
      ULTRA_NGFF_INTENSITY_RANGE_MAX_BYTES: "${ULTRA_NGFF_INTENSITY_RANGE_MAX_BYTES:-67108864}"
    volumes:
      - ultra-uploads:/data/uploads
    ports:
      # The sidecar accepts trusted filesystem paths from the control plane and has no
      # client authentication of its own. Keep the host-development proxy reachable while
      # preventing direct LAN access that could bypass tenant-scoped resource resolution.
      - "127.0.0.1:${NGFF_SERVICE_PORT:-8092}:8091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8091/healthz').status==200 else 1)"]
      interval: 5s
      timeout: 5s
      retries: 30

  # Build-only: the worker runs this image (execute_python) via the host Docker
  # daemon, so it just needs to exist + be tagged. It builds on `up --build`, then
  # exits. Heavy (~9GB scientific Python). Skip with: docker compose up --scale codeexec-sandbox=0
  codeexec-sandbox:
    build:
      context: .
      dockerfile: deploy/docker/deepagents-sandbox.Dockerfile
    image: ${ULTRA_SANDBOX_IMAGE:-bisque-ultra-codeexec:py311}
    command: ["sh", "-c", "echo 'code-exec sandbox image ready'"]
    restart: "no"

  control-plane:
    build:
      context: backend/controlplane
    image: ultra-control:local
    environment:
      # Run the SAME code path production runs. config.Validate() returns early
      # unless ENVIRONMENT=production (config.go), so with anything else the whole
      # production requirement block — durable backends, auth provider — is NEVER
      # exercised locally. Keeping this at `production` is the single
      # highest-value parity setting in this file.
      ENVIRONMENT: ${ULTRA_ENVIRONMENT:-production}
      # Production refuses dev auth outright; this is the one explicit, documented
      # relaxation so the local inner loop keeps a username/password form. Set
      # ULTRA_AUTH_PROVIDER=workos (plus the WorkOS vars below) to run prod's real
      # auth path before a rollout.
      ULTRA_CONTROL_ALLOW_DEV_AUTH_IN_PRODUCTION: ${ULTRA_ALLOW_DEV_AUTH:-true}
      ULTRA_CONTROL_HTTP_ADDR: 0.0.0.0:8000
      # Defaults to the stack's own Postgres. Override to reuse an existing,
      # already-migrated database (e.g. the native dev stack's Postgres on the
      # host) via ULTRA_DATABASE_URL.
      ULTRA_CONTROL_DATABASE_URL: ${ULTRA_DATABASE_URL:-postgres://postgres:postgres@postgres:5432/bisque_ultra?sslmode=disable}
      ULTRA_CONTROL_NATS_URL: nats://${ULTRA_NATS_TOKEN:-local-dev-nats-token}@nats:4222
      ULTRA_CONTROL_UPLOAD_ROOT: /data/uploads
      # Artifacts live on a host-bind shared with the worker's code-exec sandbox
      # (see ULTRA_DATA_DIR note in the worker service).
      ULTRA_CONTROL_ARTIFACT_ROOT: ${ULTRA_DATA_DIR:-/tmp/ultra-data}/artifacts
      ULTRA_CONTROL_IMAGE_SERVICE_URL: http://image-service:8090
      # Figure captioning (run-output images) via a grounded VLM — off unless ENABLED
      # is set and a base URL is provided; degrades to no caption if unreachable.
      ULTRA_CONTROL_VLM_ENABLED: "${ULTRA_CONTROL_VLM_ENABLED:-}"
      ULTRA_CONTROL_VLM_BASE_URL: "${ULTRA_CONTROL_VLM_BASE_URL:-}"
      ULTRA_CONTROL_VLM_MODEL: "${ULTRA_CONTROL_VLM_MODEL:-Qwen3.6-27B}"
      ULTRA_CONTROL_VLM_API_KEY: "${ULTRA_CONTROL_VLM_API_KEY:-}"
      ULTRA_CONTROL_NGFF_SERVICE_URL: ${ULTRA_CONTROL_NGFF_SERVICE_URL:-http://ngff-service:8091}
      ULTRA_CONTROL_AUTH_PROVIDER: ${ULTRA_AUTH_PROVIDER:-dev}
      ULTRA_CONTROL_DEV_ADMIN_ENABLED: ${ULTRA_DEV_ADMIN_ENABLED:-true}
      # Bootstrap admin allowlist — same mechanism production uses to grant the
      # admin console (the session role is recomputed from this on every session
      # read; comma-separated, case-insensitive).
      ULTRA_CONTROL_ADMIN_EMAILS: ${ULTRA_ADMIN_EMAILS:-}
      ULTRA_CONTROL_WORKER_TOKEN: ${ULTRA_WORKER_TOKEN:-local-dev-worker-token}
      ULTRA_CONTROL_BISQUE_ROOT_URL: ${ULTRA_BISQUE_ROOT_URL:-}
      # Required by production validation whenever a BisQue root is configured
      # (linked BisQue credentials are AES-256-GCM sealed with it). Local-only
      # key; production uses its own from the deployment environment.
      ULTRA_CONTROL_SECRET_ENCRYPTION_KEY: ${ULTRA_SECRET_ENCRYPTION_KEY:-bG9jYWwtZGV2LW9ubHkta2V5LWRvLW5vdC1zaGlwISE=}
      ULTRA_CONTROL_SECRET_ENCRYPTION_KEY_ID: ${ULTRA_SECRET_ENCRYPTION_KEY_ID:-local-dev-key}
      # WorkOS opt-in (ULTRA_AUTH_PROVIDER=workos). Redirect URIs point at the
      # edge origin, not the control plane, because the SPA and API are
      # same-origin here exactly as they are behind the production edge.
      ULTRA_CONTROL_WORKOS_CLIENT_ID: ${ULTRA_WORKOS_CLIENT_ID:-}
      ULTRA_CONTROL_WORKOS_API_KEY: ${ULTRA_WORKOS_API_KEY:-}
      ULTRA_CONTROL_WORKOS_COOKIE_PASSWORD: ${ULTRA_WORKOS_COOKIE_PASSWORD:-}
      ULTRA_CONTROL_WORKOS_REDIRECT_URI: ${ULTRA_WORKOS_REDIRECT_URI:-http://localhost:${FRONTEND_PORT:-5174}/v2/auth/workos/callback}
      ULTRA_CONTROL_WORKOS_POST_LOGIN_REDIRECT_URI: ${ULTRA_WORKOS_POST_LOGIN_REDIRECT_URI:-http://localhost:${FRONTEND_PORT:-5174}/}
      ULTRA_CONTROL_WORKOS_LOGOUT_REDIRECT_URI: ${ULTRA_WORKOS_LOGOUT_REDIRECT_URI:-http://localhost:${FRONTEND_PORT:-5174}/}
      ULTRA_CONTROL_WORKOS_COOKIE_SECURE: ${ULTRA_WORKOS_COOKIE_SECURE:-false}
    volumes:
      - ultra-uploads:/data/uploads
      - ${ULTRA_DATA_DIR:-/tmp/ultra-data}:${ULTRA_DATA_DIR:-/tmp/ultra-data}
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach a HOST Postgres via ULTRA_DATABASE_URL
    ports:
      - "${CONTROL_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      ngff-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/v2/health"]
      interval: 5s
      timeout: 5s
      retries: 30

  worker:
    build:
      context: backend/deepagents_runtime
      dockerfile: Dockerfile.worker
    image: ultra-worker:local
    environment:
      OPENAI_BASE_URL: ${ULTRA_MODEL_BASE_URL:-http://host.docker.internal:11434/v1}
      OPENAI_MODEL: ${ULTRA_MODEL_NAME:-gpt-oss:20b}
      OPENAI_API_KEY: ${ULTRA_MODEL_API_KEY:-EMPTY}
      # Arms adaptive context compaction: with this set, the model profile exists and
      # deepagents summarizes at 85% of the window keeping 10% (plus history offload
      # to /conversation_history and pre-compaction tool-arg clipping). Unset, the
      # profile-less fallback is trigger=170k tokens / keep=LAST 6 MESSAGES — a cliff
      # no run should hit. Default = deepseek_v4's served max_model_len 786432 minus
      # 64K generation headroom (verified via /v1/models 2026-08-04; live-validated
      # at a forced 96K window: 3 compaction cycles, bounded context, zero guard
      # firings, todos/ledger state intact across every cycle). Override per model.
      ULTRA_DEEPAGENTS_MODEL_MAX_INPUT_TOKENS: ${ULTRA_DEEPAGENTS_MODEL_MAX_INPUT_TOKENS:-720896}
      ULTRA_DEEPAGENTS_TRACE_LENS_INPUTS: ${ULTRA_TRACE_LENS_INPUTS:-false}
      # A one-hour hard ceiling protects silent tools. Once coordinator output
      # has begun and no tool is active, fail over much sooner if the provider
      # leaves its stream dead-open after reasoning.
      ULTRA_DEEPAGENTS_MODEL_STREAM_IDLE_TIMEOUT_SECONDS: ${ULTRA_DEEPAGENTS_MODEL_STREAM_IDLE_TIMEOUT_SECONDS:-3600}
      ULTRA_DEEPAGENTS_MODEL_OUTPUT_IDLE_TIMEOUT_SECONDS: ${ULTRA_DEEPAGENTS_MODEL_OUTPUT_IDLE_TIMEOUT_SECONDS:-120}
      ULTRA_CONTROL_BASE_URL: http://control-plane:8000
      ULTRA_CONTROL_WORKER_TOKEN: ${ULTRA_WORKER_TOKEN:-local-dev-worker-token}
      ULTRA_CONTROL_NATS_URL: nats://${ULTRA_NATS_TOKEN:-local-dev-nats-token}@nats:4222
      ULTRA_NATS_URL: nats://${ULTRA_NATS_TOKEN:-local-dev-nats-token}@nats:4222
      ULTRA_CONTROL_DATABASE_URL: ${ULTRA_DATABASE_URL:-postgres://postgres:postgres@postgres:5432/bisque_ultra?sslmode=disable}
      ULTRA_CONTROL_ARTIFACT_ROOT: ${ULTRA_DATA_DIR:-/tmp/ultra-data}/artifacts
      ULTRA_ARTIFACT_ROOT: ${ULTRA_DATA_DIR:-/tmp/ultra-data}/artifacts
      ULTRA_UPLOAD_ROOTS: /data/uploads
      ULTRA_DEEPAGENTS_WORKSPACE_ROOT: ${ULTRA_DATA_DIR:-/tmp/ultra-data}/workspace
      ULTRA_DEEPAGENTS_MEMORY_ROOT: ${ULTRA_DATA_DIR:-/tmp/ultra-data}/memory
      # Code execution: the worker runs each run's code in the sandbox image via
      # the host Docker daemon (mounted socket). The sandbox bind-mounts the run's
      # workspace + artifact dir BY PATH on the host daemon, so those dirs must sit
      # at the SAME absolute path inside the worker and on the host — hence the
      # ULTRA_DATA_DIR host-bind below (not a named volume).
      ULTRA_DEEPAGENTS_SANDBOX_IMAGE: ${ULTRA_SANDBOX_IMAGE:-bisque-ultra-codeexec:py311}
      ULTRA_DEEPAGENTS_SANDBOX_NETWORK: ${ULTRA_SANDBOX_NETWORK:-none}
      # Aggregate per-worker cap on simultaneous sandbox containers. 0 = unbounded
      # (fine for ONE worker). Set a finite value BEFORE `make scale-workers N=...`
      # so N workers cannot oversubscribe this single host's Docker daemon.
      ULTRA_DEEPAGENTS_SANDBOX_MAX_CONCURRENCY: ${ULTRA_SANDBOX_MAX_CONCURRENCY:-0}
      ULTRA_DEEPAGENTS_SANDBOX_QUEUE_TIMEOUT_SECONDS: ${ULTRA_SANDBOX_QUEUE_TIMEOUT_SECONDS:-120}
      # Per-container resource caps (empty = Docker default). Set a memory cap when
      # scaling workers so one runaway sandbox cannot OOM the shared host.
      ULTRA_DEEPAGENTS_SANDBOX_MEMORY: ${ULTRA_SANDBOX_MEMORY:-}
      ULTRA_DEEPAGENTS_SANDBOX_SHM_SIZE: ${ULTRA_SANDBOX_SHM_SIZE:-}
      # Optional external vision VLM — off unless ULTRA_QWEN_VLM_ENABLED=true and a
      # reachable endpoint/key are set in .env.docker (we never host this GPU).
      QWEN_VLM_ENABLED: ${ULTRA_QWEN_VLM_ENABLED:-false}
      QWEN_VLM_BASE_URL: ${ULTRA_QWEN_VLM_BASE_URL:-}
      QWEN_VLM_MODEL: ${ULTRA_QWEN_VLM_MODEL:-}
      QWEN_VLM_MODEL_REVISION: ${ULTRA_QWEN_VLM_MODEL_REVISION:-}
      QWEN_VLM_RUNTIME_IDENTITY: ${ULTRA_QWEN_VLM_RUNTIME_IDENTITY:-}
      QWEN_VLM_DEPLOYMENT_ATTESTATION_PATH: ${ULTRA_QWEN_VLM_DEPLOYMENT_ATTESTATION_PATH:-}
      QWEN_VLM_DEPLOYMENT_ATTESTATION_SHA256: ${ULTRA_QWEN_VLM_DEPLOYMENT_ATTESTATION_SHA256:-}
      QWEN_VLM_API_KEY: ${ULTRA_QWEN_VLM_API_KEY:-}
      # MAX_INPUT_TOKENS must match the endpoint's served max_model_len
      # (GET /v1/models). CLIENT_MAX_EDGE is an upload-side bound only: the
      # served processor normalizes every image into its own fixed vision-token
      # budget, so raising it beyond the server's effective resolution adds
      # upload bytes, not model-visible detail — raise it only together with
      # the serve command's mm-processor max_pixels.
      QWEN_VLM_MAX_INPUT_TOKENS: ${ULTRA_QWEN_VLM_MAX_INPUT_TOKENS:-131072}
      QWEN_VLM_CLIENT_MAX_EDGE: ${ULTRA_QWEN_VLM_CLIENT_MAX_EDGE:-1280}
      # Optional external GPU MegaSeg inference service — off unless a URL is set.
      MEGASEG_SERVICE_URL: ${ULTRA_MEGASEG_SERVICE_URL:-}
      MEGASEG_SERVICE_API_KEY: ${ULTRA_MEGASEG_SERVICE_API_KEY:-}
    volumes:
      - ultra-uploads:/data/uploads
      - ${ULTRA_DATA_DIR:-/tmp/ultra-data}:${ULTRA_DATA_DIR:-/tmp/ultra-data}
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway" # reach a HOST Ollama/vLLM on Linux
    # Production runs MULTIPLE workers sharing one NATS durable (a queue group),
    # so run more than one here too: it is the only way local exercises the real
    # distribution semantics — competing consumers, run leases, redelivery to a
    # second worker — instead of a single-consumer happy path.
    deploy:
      replicas: ${ULTRA_WORKER_REPLICAS:-2}
    depends_on:
      nats:
        condition: service_healthy
      postgres:
        condition: service_healthy
      control-plane:
        condition: service_started

  frontend:
    build:
      context: frontend
    image: ultra-frontend:local
    ports:
      - "${FRONTEND_PORT:-5174}:80"
    depends_on:
      control-plane:
        condition: service_started

volumes:
  ultra-pgdata:
  ultra-uploads:
  ultra-nats:
