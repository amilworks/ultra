<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Bisque Ultra Web</title>
    <meta
      name="description"
      content="An AI research workspace for scientific imaging — explore, analyze, and orchestrate large image datasets."
    />
    <!-- Meridian grounds. Media-scoped so browser chrome matches the app
         before any JS runs; useThemePreference re-points both when the in-app
         preference overrides the OS scheme. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f3f3" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0e11" />

    <!-- Open Graph — Slack, LinkedIn, Facebook, iMessage, Discord, ... -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bisque Ultra" />
    <meta property="og:url" content="https://ultra.ece.ucsb.edu/" />
    <meta property="og:title" content="Bisque Ultra" />
    <meta
      property="og:description"
      content="An AI research workspace for scientific imaging — explore, analyze, and orchestrate large image datasets."
    />
    <meta property="og:image" content="https://ultra.ece.ucsb.edu/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Bisque Ultra — an AI research workspace for scientific imaging"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bisque Ultra" />
    <meta
      name="twitter:description"
      content="An AI research workspace for scientific imaging — explore, analyze, and orchestrate large image datasets."
    />
    <meta name="twitter:image" content="https://ultra.ece.ucsb.edu/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
